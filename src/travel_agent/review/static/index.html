<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt địa điểm Huế</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e3e1dc;
    --accent: #2f5d8a; --ok: #2e7d4f; --warn: #b26a00; --bad: #b3261e; --pending: #8a8a90;
    --sel: #e8eef5; --code: #f0eee9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161618; --panel: #1f1f22; --ink: #ececee; --muted: #9a9aa2; --line: #333338;
      --accent: #7fb0e0; --ok: #5cc28a; --warn: #e3a64a; --bad: #f08a80; --pending: #8a8a90;
      --sel: #263445; --code: #2a2a2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh; display: grid; grid-template-rows: auto 1fr auto;
  }
  header { display: flex; gap: 24px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 17px; margin: 0; white-space: nowrap; }
  .progress { flex: 1; min-width: 0; }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
  .bar span { display: block; height: 100%; }
  .nums { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .layout { display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 14px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tabs button span { opacity: .75; margin-left: 4px; }
  .filters { display: flex; gap: 6px; padding: 10px; border-bottom: 1px solid var(--line); }
  .filters select, .filters input { flex: 1; min-width: 0; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .count { padding: 6px 12px; color: var(--muted); font-size: 12px; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #list li { display: grid; grid-template-columns: 10px 1fr; column-gap: 8px; padding: 7px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  #list li.sel { background: var(--sel); }
  #list .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; grid-row: span 2; }
  #list .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .meta { color: var(--muted); font-size: 12px; }
  #more { margin: 8px; padding: 6px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 6px; cursor: pointer; }
  .dot.pending { background: var(--pending); } .dot.approved { background: var(--ok); }
  .dot.needs_fix { background: var(--warn); } .dot.rejected { background: var(--bad); }
  main { overflow-y: auto; padding: 16px 20px; display: grid; gap: 14px; align-content: start; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .full { grid-column: 1 / -1; }
  .title-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  h2 { font-size: 19px; margin: 0; }
  h3 { font-size: 14px; margin: 0 0 10px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; color: #fff; white-space: nowrap; }
  .badge.pending { background: var(--pending); } .badge.approved { background: var(--ok); }
  .badge.needs_fix { background: var(--warn); } .badge.rejected { background: var(--bad); }
  dl.facts { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; margin: 12px 0; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .tag { font-size: 11.5px; padding: 1px 6px; border-radius: 8px; border: 1px solid currentColor; margin-left: 4px; white-space: nowrap; }
  .tag.ok { color: var(--ok); } .tag.warn { color: var(--warn); }
  .links { display: flex; gap: 14px; flex-wrap: wrap; }
  a { color: var(--accent); }
  .map { min-height: 300px; border-radius: 10px; border: 1px solid var(--line); overflow: hidden; }
  form label { display: grid; gap: 4px; margin-bottom: 10px; color: var(--muted); font-size: 12.5px; }
  form input, form select, form textarea { width: 100%; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .actions button { border: 0; border-radius: 7px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; color: #fff; }
  .actions .approve { background: var(--ok); } .actions .fix { background: var(--warn); }
  .actions .reject { background: var(--bad); }
  .actions .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .actions button:disabled { opacity: .45; cursor: default; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid rgba(255,255,255,.5); border-radius: 3px; padding: 0 4px; margin-left: 6px; }
  .ghost kbd { border-color: var(--line); }
  .muted, .empty { color: var(--muted); }
  footer { padding: 6px 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; background: var(--panel); }
  #toast { position: fixed; right: 20px; bottom: 44px; padding: 10px 14px; border-radius: 8px; background: var(--ink); color: var(--bg); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 420px; }
  #toast.show { opacity: .95; } #toast.error { background: var(--bad); color: #fff; }
  @media (max-width: 860px) {
    body { height: auto; }
    header { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 16px; }
    .layout { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); max-height: 45vh; }
    main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
    dl.facts { grid-template-columns: 110px 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Duyệt địa điểm Huế</h1>
  <div class="progress" id="progress"></div>
</header>
<div class="layout">
  <aside>
    <div class="tabs" id="tabs"></div>
    <div class="filters">
      <select id="category" aria-label="Lọc theo loại"><option value="">Mọi loại</option></select>
      <input id="search" type="search" placeholder="Tìm tên hoặc id" aria-label="Tìm kiếm">
    </div>
    <div class="count" id="listCount"></div>
    <ul id="list"></ul>
    <button id="more" hidden>Tải thêm</button>
  </aside>
  <main id="detail"><p class="empty">Đang tải…</p></main>
</div>
<footer>
  Dữ liệu địa điểm © OpenStreetMap contributors (ODbL-1.0).
  Phím tắt: A duyệt · F cần sửa · R loại · U bỏ đánh giá · J/K hoặc ↓/↑ chuyển địa điểm.
</footer>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";
const STATUS_LABEL = { pending: "Chờ duyệt", needs_fix: "Cần sửa", approved: "Đã duyệt", rejected: "Đã loại", all: "Tất cả" };
const CATEGORY_LABEL = {
  attraction: "Điểm tham quan", museum: "Bảo tàng", historic: "Di tích", viewpoint: "Điểm ngắm cảnh",
  restaurant: "Quán ăn", cafe: "Cafe", market: "Chợ", park: "Công viên", religious: "Cơ sở tôn giáo",
};
const TABS = ["pending", "needs_fix", "approved", "rejected", "all"];
const OVERRIDE_FIELDS = ["name_override", "category_override", "opening_hours_override", "evidence", "note"];
const PAGE = 50;
const state = { status: "pending", category: "", q: "", items: [], total: 0, sel: -1, stats: null, meta: null, busy: false };
let map = null;

const $ = (id) => document.getElementById(id);
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const catLabel = (c) => CATEGORY_LABEL[c] || c;
const fmtDate = (iso) => (iso ? new Date(iso).toLocaleString("vi-VN") : "");

async function api(path, options = {}) {
  const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
  if (!response.ok) {
    let message = `${response.status} ${response.statusText}`;
    try {
      const body = await response.json();
      message = Array.isArray(body.detail)
        ? body.detail.map((d) => String(d.msg).replace(/^Value error, /, "")).join("; ")
        : body.detail || message;
    } catch (_) { /* giữ message mặc định */ }
    throw new Error(message);
  }
  return response.status === 204 ? null : response.json();
}

let toastTimer = null;
function toast(message, isError = false) {
  const el = $("toast");
  el.textContent = message;
  el.className = "show" + (isError ? " error" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.className = ""), isError ? 5000 : 1600);
}

async function loadStats() {
  state.stats = await api("/api/stats");
  const s = state.stats;
  const done = s.approved + s.needs_fix + s.rejected;
  const pct = (n) => (s.total ? (n * 100) / s.total : 0);
  $("progress").innerHTML = `
    <div class="bar" aria-hidden="true">
      <span style="width:${pct(s.approved)}%;background:var(--ok)"></span>
      <span style="width:${pct(s.needs_fix)}%;background:var(--warn)"></span>
      <span style="width:${pct(s.rejected)}%;background:var(--bad)"></span>
    </div>
    <div class="nums">${done}/${s.total} đã xử lý (${Math.round(pct(done))}%) · Đã duyệt ${s.approved} · Cần sửa ${s.needs_fix} · Đã loại ${s.rejected} · Chờ duyệt ${s.pending}</div>`;
  $("tabs").innerHTML = TABS.map((t) => `<button type="button" data-status="${t}" class="${t === state.status ? "active" : ""}">${STATUS_LABEL[t]}<span>${t === "all" ? s.total : s[t]}</span></button>`).join("");
}

async function loadList(reset) {
  if (reset) { state.items = []; state.sel = -1; }
  const params = new URLSearchParams({ offset: state.items.length, limit: PAGE });
  if (state.status !== "all") params.set("status", state.status);
  if (state.category) params.set("category", state.category);
  if (state.q) params.set("q", state.q);
  const data = await api("/api/places?" + params);
  state.items.push(...data.items);
  state.total = data.total;
  renderList();
  if (reset) select(state.items.length ? 0 : -1);
}

function renderList() {
  $("list").innerHTML = state.items.map((it, i) => `
    <li data-i="${i}" class="${i === state.sel ? "sel" : ""}">
      <span class="dot ${it.status}"></span>
      <span class="name">${esc(it.effective.name)}</span>
      <span class="meta">${esc(catLabel(it.effective.category))}${it.hours_parsed === true ? " · có giờ mở cửa" : ""}</span>
    </li>`).join("");
  $("listCount").textContent = `${state.items.length}/${state.total} địa điểm`;
  $("more").hidden = state.items.length >= state.total;
}

function select(i) {
  state.sel = i;
  for (const li of $("list").children) li.classList.toggle("sel", Number(li.dataset.i) === i);
  $("list").querySelector(`li[data-i="${i}"]`)?.scrollIntoView({ block: "nearest" });
  renderDetail();
}

function hoursTag(it) {
  if (it.hours_parsed === null) return '<span class="tag warn">chưa có dữ liệu</span>';
  if (it.hours_parsed) return '<span class="tag ok">parser hiểu được</span>';
  return '<span class="tag warn">parser chưa hiểu, coi là unknown</span>';
}

function renderDetail() {
  const it = state.items[state.sel];
  if (map) { map.remove(); map = null; }
  if (!it) {
    $("detail").innerHTML = '<p class="empty full">Không có địa điểm nào trong bộ lọc này.</p>';
    return;
  }
  const p = it.place;
  const r = it.review || {};
  const { lat, lon } = p.coords;
  const categoryOptions = state.meta.categories
    .map((c) => `<option value="${c}" ${r.category_override === c ? "selected" : ""}>${esc(catLabel(c))}</option>`).join("");
  $("detail").innerHTML = `
    <section class="card">
      <div class="title-row"><h2>${esc(it.effective.name)}</h2><span class="badge ${it.status}">${STATUS_LABEL[it.status]}</span></div>
      <dl class="facts">
        <dt>Loại</dt><dd>${esc(catLabel(p.category))}${r.category_override ? ` → <b>${esc(catLabel(r.category_override))}</b>` : ""}</dd>
        <dt>Tên gốc (OSM)</dt><dd>${esc(p.name)}</dd>
        <dt>Giờ mở cửa (OSM)</dt><dd><code>${esc(p.opening_hours_raw || "—")}</code> ${hoursTag(it)}</dd>
        <dt>Tọa độ</dt><dd>${lat.toFixed(6)}, ${lon.toFixed(6)}</dd>
        <dt>Nguồn</dt><dd>${esc(p.source)} · ${esc(p.license)} · dữ liệu lúc ${esc(fmtDate(p.collected_at))}</dd>
        <dt>ID</dt><dd><code>${esc(p.id)}</code></dd>
      </dl>
      <div class="links">
        ${it.osm_url ? `<a href="${esc(it.osm_url)}" target="_blank" rel="noopener">Mở trên OpenStreetMap</a>` : ""}
        <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lon}" target="_blank" rel="noopener">Đối chiếu trên Google Maps</a>
      </div>
    </section>
    <div id="map" class="map"></div>
    <form id="form" class="card full" autocomplete="off">
      <h3>Chỉnh sửa (tùy chọn, dữ liệu OSM gốc được giữ nguyên)</h3>
      <label>Tên đúng<input name="name_override" value="${esc(r.name_override)}" placeholder="${esc(p.name)}"></label>
      <label>Loại đúng<select name="category_override"><option value="">(giữ nguyên)</option>${categoryOptions}</select></label>
      <label>Giờ mở cửa đã kiểm chứng (cú pháp OSM)<input name="opening_hours_override" value="${esc(r.opening_hours_override)}" placeholder="Mo-Su 07:00-17:30"></label>
      <label>Nguồn kiểm chứng (bắt buộc khi sửa giờ)<input name="evidence" value="${esc(r.evidence)}" placeholder="URL hoặc mô tả nguồn, kèm ngày kiểm tra"></label>
      <label>Ghi chú<textarea name="note" rows="2">${esc(r.note)}</textarea></label>
      <div class="actions">
        <button type="button" data-act="approved" class="approve">Duyệt<kbd>A</kbd></button>
        <button type="button" data-act="needs_fix" class="fix">Cần sửa<kbd>F</kbd></button>
        <button type="button" data-act="rejected" class="reject">Loại<kbd>R</kbd></button>
        <button type="button" data-act="clear" class="ghost" ${it.status === "pending" ? "disabled" : ""}>Bỏ đánh giá<kbd>U</kbd></button>
      </div>
      ${r.reviewed_at ? `<p class="muted">Lần duyệt gần nhất: ${esc(fmtDate(r.reviewed_at))}</p>` : ""}
    </form>`;
  $("form").addEventListener("click", (event) => {
    const button = event.target.closest("button[data-act]");
    if (button && !button.disabled) act(button.dataset.act);
  });
  renderMap(lat, lon);
}

function renderMap(lat, lon) {
  const el = $("map");
  if (!window.L) {
    el.innerHTML = '<p class="muted" style="padding:12px">Không tải được bản đồ (cần internet). Dùng các link phía trên để đối chiếu.</p>';
    return;
  }
  map = L.map(el).setView([lat, lon], 17);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  }).addTo(map);
  L.marker([lat, lon]).addTo(map);
}

async function act(kind) {
  const it = state.items[state.sel];
  if (!it || state.busy) return;
  state.busy = true;
  try {
    if (kind === "clear") {
      await api("/api/reviews?" + new URLSearchParams({ place_id: it.place.id }), { method: "DELETE" });
    } else {
      const form = new FormData($("form"));
      const body = { place_id: it.place.id, status: kind };
      for (const field of OVERRIDE_FIELDS) body[field] = String(form.get(field) || "").trim() || null;
      await api("/api/reviews", { method: "PUT", body: JSON.stringify(body) });
    }
    const fresh = await api("/api/place?" + new URLSearchParams({ place_id: it.place.id }));
    if (state.status === "all" || fresh.status === state.status) {
      state.items[state.sel] = fresh;
      if (state.sel < state.items.length - 1) state.sel += 1;
    } else {
      state.items.splice(state.sel, 1);
      state.total -= 1;
      if (state.sel >= state.items.length) state.sel = state.items.length - 1;
    }
    toast(kind === "clear" ? "Đã bỏ đánh giá" : `Đã lưu: ${STATUS_LABEL[kind]}`);
    await loadStats();
    renderList();
    renderDetail();
    if (state.items.length - state.sel < 5 && state.items.length < state.total) await loadList(false);
  } catch (error) {
    toast(error.message, true);
  } finally {
    state.busy = false;
  }
}

function move(delta) {
  const next = state.sel + delta;
  if (next >= 0 && next < state.items.length) select(next);
  if (next >= state.items.length - 3 && state.items.length < state.total) loadList(false).catch((e) => toast(e.message, true));
}

document.addEventListener("keydown", (event) => {
  if (event.target.closest("input, textarea, select") || event.ctrlKey || event.metaKey || event.altKey) return;
  const key = event.key.toLowerCase();
  const actions = { a: "approved", f: "needs_fix", r: "rejected", u: "clear" };
  if (actions[key]) { event.preventDefault(); act(actions[key]); }
  else if (key === "j" || event.key === "ArrowDown") { event.preventDefault(); move(1); }
  else if (key === "k" || event.key === "ArrowUp") { event.preventDefault(); move(-1); }
});

$("tabs").addEventListener("click", (event) => {
  const button = event.target.closest("button[data-status]");
  if (!button) return;
  state.status = button.dataset.status;
  loadStats().then(() => loadList(true)).catch((e) => toast(e.message, true));
});
$("category").addEventListener("change", (event) => {
  state.category = event.target.value;
  loadList(true).catch((e) => toast(e.message, true));
});
let searchTimer = null;
$("search").addEventListener("input", (event) => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.q = event.target.value.trim();
    loadList(true).catch((e) => toast(e.message, true));
  }, 300);
});
$("list").addEventListener("click", (event) => {
  const li = event.target.closest("li[data-i]");
  if (li) select(Number(li.dataset.i));
});
$("more").addEventListener("click", () => loadList(false).catch((e) => toast(e.message, true)));

(async function init() {
  try {
    state.meta = await api("/api/meta");
    $("category").insertAdjacentHTML("beforeend", state.meta.categories.map((c) => `<option value="${c}">${esc(catLabel(c))}</option>`).join(""));
    await loadStats();
    await loadList(true);
  } catch (error) {
    $("detail").innerHTML = `<p class="empty full">Không tải được dữ liệu: ${esc(error.message)}</p>`;
  }
})();
</script>
</body>
</html>
