# Tham số RL (plan 5, Task 3). Script scripts/train/grpo.py đọc file này. Output nặng nằm ngoài
# OneDrive, dưới runs_dir/<run_name>/. Base model và lượng tử hóa lấy từ `sft_config`, để RL
# luôn chạy trên đúng model mà SFT đã train.
rl:
  run_name: rl-v1
  # `grpo` (TRL GRPOTrainer, mục `grpo`) hoặc `best_of_n` (mục `best_of_n`, plan 5 Task 4).
  # Smoke GRPO 2026-11-18: 8,8 phút/step, VRAM đỉnh 9,43 GB > 8 GB: không qua cổng spec 8.3.
  method: best_of_n
  # Python của venv train (torch, transformers, peft, trl). Đường dẫn theo máy.
  python: C:/dev/venvs/travel/Scripts/python.exe
  runs_dir: C:/dev/travelagent-runs/rl
  # Adapter SFT đã chọn (step 250, plan 4). Nạp ở chế độ trainable để RL tinh chỉnh tiếp.
  init_adapter: models/sft/sft-v1/adapters/step-250
  sft_config: configs/sft.yaml
  db: data/hue.sqlite
  evalset: data/eval/hue_eval_v1.jsonl
  # Dataset SFT: mọi request của nó bị loại khỏi tập train RL để không trùng dữ liệu đã học.
  sft_dataset: data/sft/hue_sft_v1.jsonl
  seed: 4242
  # Số request train RL (sau khi đã loại request trùng eval và SFT). Đủ cho best_of_n:
  # requests_per_round × max_rounds = 500 × 5.
  requests: 2500
  # Nơi gửi metrics khi train (wandb: xem reward và các chỉ số theo step trên web).
  report_to: wandb
  tracking:
    # Project W&B (private). Chỉ gửi metrics và config, không gửi dataset hay trọng số.
    project: travel-agent-sft
  smoke:
    max_steps: 5
grpo:
  # Số completion sampled cho mỗi prompt; advantage tính trong nhóm này.
  num_generations: 4
  # Micro-batch 1 để vừa 8 GB VRAM: logits của Qwen3.5 có vocab lớn, batch 4 sẽ tràn bộ nhớ.
  per_device_batch_size: 1
  # per_device_batch_size * gradient_accumulation_steps = 8 completion = 2 prompt mỗi lần
  # sinh (chia hết cho num_generations: bắt buộc của TRL).
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  max_completion_length: 1024
  temperature: 1.0
  # Hệ số KL với model tham chiếu. 0,0 là mặc định của TRL: không nạp model tham chiếu, tiết
  # kiệm VRAM. Chỉ đặt > 0 nếu reward sụp.
  beta: 0.0
  max_steps: 500
  # Checkpoint đầy đủ (adapter + optimizer) để chạy tiếp; đây là khoảng ngắn vì mỗi step tốn
  # nhiều phút.
  save_steps: 25
  # Reward và chỉ số chẩn đoán cho dashboard từng step.
  logging_steps: 1
best_of_n:
  # Plan 5 Task 4. Không dùng khi method là grpo.
  requests_per_round: 500
  # Số mẫu sinh cho mỗi request; giữ mẫu reward cao nhất.
  samples: 4
  # Chỉ giữ mẫu có reward từ ngưỡng này trở lên.
  threshold: 0.9
  learning_rate: 5.0e-5
  epochs: 1
  max_rounds: 5
  temperature: 1.0
final:
  # Người dùng chọn vòng 1 ngày 2026-11-18: vòng 2 chỉ hơn 1/70 request nhưng số stop mỗi ngày
  # giảm 9,9% so với SFT, sát ngưỡng lách reward.
  dataset: data/rl/rl-v1/round-1.jsonl
  stats: data/rl/rl-v1/round-1.stats.json
  round: 1
  # Model Ollama của adapter RL sau khi export.
  ollama_model: travel-rl-v1
  learning_rate: 5.0e-5
  epochs: 1
