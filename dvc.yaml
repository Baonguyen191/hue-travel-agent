vars:
  - configs/eval.yaml
  - configs/sft.yaml
  - configs/rl.yaml

stages:
  make_evalset:
    cmd: >-
      python -m travel_agent make-evalset
      --seed ${evalset.seed}
      --out data/eval/hue_eval_v1.jsonl
    frozen: true
    params:
      - configs/eval.yaml:
          - evalset
    outs:
      - data/eval/hue_eval_v1.jsonl:
          cache: false

  baseline_eval:
    cmd: >-
      python -m travel_agent eval
      --db data/hue.sqlite
      --evalset data/eval/hue_eval_v1.jsonl
      --split dev
      --model ${baseline.model}
      --temperature ${generation.temperature}
      --seed ${generation.seed}
      --num-predict ${generation.num_predict}
      --num-ctx ${generation.num_ctx}
      --run-name baseline
      --mlflow
      --out reports/eval/baseline_dev.json
    deps:
      - data/hue.sqlite
      - data/eval/hue_eval_v1.jsonl
      - src/travel_agent/data/place_repository.py
      - src/travel_agent/domain/models.py
      - src/travel_agent/domain/opening_hours.py
      - src/travel_agent/planning/candidates.py
      - src/travel_agent/planning/prompt.py
      - src/travel_agent/review/models.py
      - src/travel_agent/review/store.py
      - src/travel_agent/routing/travel_time.py
      - src/travel_agent/training/commands.py
      - src/travel_agent/training/generator.py
      - src/travel_agent/training/metrics.py
      - src/travel_agent/training/parsing.py
      - src/travel_agent/training/requests.py
      - src/travel_agent/training/runner.py
      - src/travel_agent/training/tracking.py
      - src/travel_agent/validation/report.py
      - src/travel_agent/validation/validator.py
    params:
      - configs/eval.yaml:
          - baseline
          - generation
    outs:
      - reports/eval/baseline_dev.outcomes.jsonl
    metrics:
      - reports/eval/baseline_dev.json:
          cache: false

  build_dataset:
    cmd: >-
      python -m travel_agent build-dataset
      --config configs/dataset.yaml
      --db data/hue.sqlite
      --evalset data/eval/hue_eval_v1.jsonl
      --out data/sft/hue_sft_v1.jsonl
      --manifest data/sft/manifest.json
    deps:
      - data/hue.sqlite
      - data/eval/hue_eval_v1.jsonl
      - src/travel_agent/data/place_repository.py
      - src/travel_agent/domain/models.py
      - src/travel_agent/domain/opening_hours.py
      - src/travel_agent/planning/candidates.py
      - src/travel_agent/planning/prompt.py
      - src/travel_agent/planning/hours.py
      - src/travel_agent/planning/solver.py
      - src/travel_agent/review/models.py
      - src/travel_agent/review/store.py
      - src/travel_agent/routing/travel_time.py
      - src/travel_agent/training/commands.py
      - src/travel_agent/training/corrupt.py
      - src/travel_agent/training/dataset.py
      - src/travel_agent/training/requests.py
      - src/travel_agent/validation/report.py
      - src/travel_agent/validation/validator.py
    params:
      - configs/dataset.yaml:
          - dataset
    outs:
      - data/sft/hue_sft_v1.jsonl
    metrics:
      - data/sft/manifest.json:
          cache: false

  check_dataset:
    # Không có cờ --allow-skip-tokens: thiếu tokenizer thật thì stage hỏng và chặn train.
    cmd: >-
      python -m travel_agent check-dataset
      --config configs/dataset.yaml
      --db data/hue.sqlite
      --evalset data/eval/hue_eval_v1.jsonl
      --dataset data/sft/hue_sft_v1.jsonl
      --out reports/dataset/check.json
    deps:
      - data/sft/hue_sft_v1.jsonl
      - data/hue.sqlite
      - data/eval/hue_eval_v1.jsonl
      - src/travel_agent/data/place_repository.py
      - src/travel_agent/domain/models.py
      - src/travel_agent/domain/opening_hours.py
      - src/travel_agent/planning/candidates.py
      - src/travel_agent/planning/prompt.py
      - src/travel_agent/planning/hours.py
      - src/travel_agent/planning/solver.py
      - src/travel_agent/review/models.py
      - src/travel_agent/review/store.py
      - src/travel_agent/routing/travel_time.py
      - src/travel_agent/training/chat.py
      - src/travel_agent/training/commands.py
      - src/travel_agent/training/corrupt.py
      - src/travel_agent/training/dataset.py
      - src/travel_agent/training/dataset_check.py
      - src/travel_agent/training/parsing.py
      - src/travel_agent/training/requests.py
      - src/travel_agent/training/tokens.py
      - src/travel_agent/validation/report.py
      - src/travel_agent/validation/validator.py
    params:
      - configs/dataset.yaml:
          - check
    metrics:
      - reports/dataset/check.json:
          cache: false

  sft:
    # Chạy bằng venv train (sft.python trong configs/sft.yaml). Checkpoint nặng nằm ở
    # sft.runs_dir, ngoài OneDrive; DVC chỉ theo dõi adapter của từng checkpoint.
    cmd: ${sft.python} scripts/train/sft.py --config configs/sft.yaml
    deps:
      - data/sft/hue_sft_v1.jsonl
      - reports/dataset/check.json
      - scripts/train/sft.py
      - src/travel_agent/data/place_repository.py
      - src/travel_agent/domain/models.py
      - src/travel_agent/domain/opening_hours.py
      - src/travel_agent/planning/candidates.py
      - src/travel_agent/planning/prompt.py
      - src/travel_agent/planning/hours.py
      - src/travel_agent/planning/solver.py
      - src/travel_agent/routing/travel_time.py
      - src/travel_agent/training/chat.py
      - src/travel_agent/training/corrupt.py
      - src/travel_agent/training/dataset.py
      - src/travel_agent/training/requests.py
      - src/travel_agent/training/sft_config.py
      - src/travel_agent/training/sft_data.py
      - src/travel_agent/training/tokens.py
      - src/travel_agent/validation/report.py
      - src/travel_agent/validation/validator.py
    params:
      - configs/sft.yaml:
          - sft
    outs:
      - models/sft/${sft.run_name}/adapters
    metrics:
      - models/sft/${sft.run_name}/train_metrics.json:
          cache: false

  export_sft:
    cmd: ${sft.python} scripts/train/export_gguf.py --config configs/sft.yaml --record
    deps:
      - models/sft/${sft.run_name}/adapters
      - scripts/train/export_gguf.py
      - src/travel_agent/training/chat.py
      - src/travel_agent/training/export.py
      - src/travel_agent/training/model_card.py
      - src/travel_agent/training/rl_config.py
      - src/travel_agent/training/sft_config.py
      - src/travel_agent/training/tokens.py
    params:
      - configs/sft.yaml:
          - export
    metrics:
      - models/sft/${sft.run_name}/export.json:
          cache: false

  eval_sft:
    cmd:
      - >-
        python -m travel_agent eval
        --db data/hue.sqlite
        --evalset data/eval/hue_eval_v1.jsonl
        --split dev
        --model ${export.ollama_model}
        --temperature ${generation.temperature}
        --seed ${generation.seed}
        --num-predict ${generation.num_predict}
        --num-ctx ${generation.num_ctx}
        --run-name sft
        --mlflow
        --baseline reports/eval/baseline_dev.json
        --out reports/eval/sft_dev.json
      - python scripts/train/write_model_card.py --config configs/sft.yaml
    deps:
      - models/sft/${sft.run_name}/export.json
      - reports/eval/baseline_dev.json
      - data/sft/manifest.json
      - data/hue.sqlite
      - data/eval/hue_eval_v1.jsonl
      - scripts/train/write_model_card.py
      - src/travel_agent/data/place_repository.py
      - src/travel_agent/domain/models.py
      - src/travel_agent/domain/opening_hours.py
      - src/travel_agent/planning/candidates.py
      - src/travel_agent/planning/prompt.py
      - src/travel_agent/planning/hours.py
      - src/travel_agent/planning/solver.py
      - src/travel_agent/review/models.py
      - src/travel_agent/review/store.py
      - src/travel_agent/routing/travel_time.py
      - src/travel_agent/training/chat.py
      - src/travel_agent/training/commands.py
      - src/travel_agent/training/corrupt.py
      - src/travel_agent/training/dataset.py
      - src/travel_agent/training/dataset_check.py
      - src/travel_agent/training/generator.py
      - src/travel_agent/training/metrics.py
      - src/travel_agent/training/model_card.py
      - src/travel_agent/training/parsing.py
      - src/travel_agent/training/requests.py
      - src/travel_agent/training/reward.py
      - src/travel_agent/training/reward_report.py
      - src/travel_agent/training/rl_config.py
      - src/travel_agent/training/runner.py
      - src/travel_agent/training/sft_config.py
      - src/travel_agent/training/tokens.py
      - src/travel_agent/training/tracking.py
      - src/travel_agent/validation/report.py
      - src/travel_agent/validation/validator.py
    params:
      - configs/eval.yaml:
          - generation
      - configs/sft.yaml:
          - export
    outs:
      - reports/eval/sft_dev.outcomes.jsonl
    metrics:
      - reports/eval/sft_dev.json:
          cache: false
      - models/sft/${sft.run_name}/model_card.json:
          cache: false

  rl:
    # Vòng best-of-N đã chọn (plan 5 Task 6): train tiếp adapter SFT step 250 trên dataset của vòng
    # đó bằng đúng cấu hình train của SFT, chỉ khác learning rate và số epoch. Checkpoint nằm ở
    # rl.runs_dir, ngoài repo; chỉ adapter cuối được chép vào models/rl/<run_name>/adapter.
    cmd: >-
      ${sft.python} scripts/train/sft.py --config configs/sft.yaml
      --init-adapter models/sft/sft-v1/adapters/step-250
      --dataset ${final.dataset}
      --run-dir ${rl.runs_dir}/${rl.run_name}/final
      --learning-rate ${final.learning_rate}
      --epochs ${final.epochs}
      --run-name rl-v1-final
      --adapter-out models/rl/${rl.run_name}/adapter
    deps:
      - data/rl/rl-v1/round-1.jsonl
      - models/sft/sft-v1/adapters/step-250
      - scripts/train/sft.py
      - src/travel_agent/data/place_repository.py
      - src/travel_agent/domain/models.py
      - src/travel_agent/domain/opening_hours.py
      - src/travel_agent/planning/candidates.py
      - src/travel_agent/planning/prompt.py
      - src/travel_agent/planning/hours.py
      - src/travel_agent/planning/solver.py
      - src/travel_agent/routing/travel_time.py
      - src/travel_agent/training/chat.py
      - src/travel_agent/training/corrupt.py
      - src/travel_agent/training/dataset.py
      - src/travel_agent/training/requests.py
      - src/travel_agent/training/sft_config.py
      - src/travel_agent/training/sft_data.py
      - src/travel_agent/training/tokens.py
      - src/travel_agent/validation/report.py
      - src/travel_agent/validation/validator.py
    params:
      - configs/rl.yaml:
          - final
      - configs/sft.yaml:
          - sft
    outs:
      - models/rl/${rl.run_name}/adapter

  export_rl:
    cmd: >-
      ${sft.python} scripts/train/export_gguf.py --config configs/sft.yaml
      --adapter models/rl/${rl.run_name}/adapter
      --name ${final.ollama_model}
      --work ${rl.runs_dir}/${rl.run_name}/export-final
      --record-out models/rl/${rl.run_name}/export.json
    deps:
      - models/rl/${rl.run_name}/adapter
      - scripts/train/export_gguf.py
      - src/travel_agent/training/chat.py
      - src/travel_agent/training/export.py
      - src/travel_agent/training/model_card.py
      - src/travel_agent/training/rl_config.py
      - src/travel_agent/training/sft_config.py
      - src/travel_agent/training/tokens.py
    params:
      - configs/rl.yaml:
          - final
      - configs/sft.yaml:
          - export
    metrics:
      - models/rl/${rl.run_name}/export.json:
          cache: false

  eval_rl:
    # Cùng lệnh eval với eval_sft (cùng sinh, cùng evalset), chỉ khác model, tên run và baseline
    # là SFT. Model card RL ghi ngay sau eval.
    cmd:
      - >-
        python -m travel_agent eval
        --db data/hue.sqlite
        --evalset data/eval/hue_eval_v1.jsonl
        --split dev
        --model ${final.ollama_model}
        --temperature ${generation.temperature}
        --seed ${generation.seed}
        --num-predict ${generation.num_predict}
        --num-ctx ${generation.num_ctx}
        --run-name rl
        --mlflow
        --baseline reports/eval/sft_dev.json
        --out reports/eval/rl_dev.json
      - python scripts/train/write_model_card.py --stage rl --rl-config configs/rl.yaml
    deps:
      - models/rl/${rl.run_name}/export.json
      - reports/eval/sft_dev.json
      - data/rl/rl-v1/round-1.jsonl
      - data/rl/rl-v1/round-1.stats.json
      - data/hue.sqlite
      - data/eval/hue_eval_v1.jsonl
      - scripts/train/write_model_card.py
      - src/travel_agent/data/place_repository.py
      - src/travel_agent/domain/models.py
      - src/travel_agent/domain/opening_hours.py
      - src/travel_agent/planning/candidates.py
      - src/travel_agent/planning/prompt.py
      - src/travel_agent/planning/hours.py
      - src/travel_agent/planning/solver.py
      - src/travel_agent/review/models.py
      - src/travel_agent/review/store.py
      - src/travel_agent/routing/travel_time.py
      - src/travel_agent/training/chat.py
      - src/travel_agent/training/commands.py
      - src/travel_agent/training/corrupt.py
      - src/travel_agent/training/dataset.py
      - src/travel_agent/training/dataset_check.py
      - src/travel_agent/training/generator.py
      - src/travel_agent/training/metrics.py
      - src/travel_agent/training/model_card.py
      - src/travel_agent/training/parsing.py
      - src/travel_agent/training/requests.py
      - src/travel_agent/training/reward.py
      - src/travel_agent/training/reward_report.py
      - src/travel_agent/training/rl_config.py
      - src/travel_agent/training/runner.py
      - src/travel_agent/training/sft_config.py
      - src/travel_agent/training/tokens.py
      - src/travel_agent/training/tracking.py
      - src/travel_agent/validation/report.py
      - src/travel_agent/validation/validator.py
    params:
      - configs/eval.yaml:
          - generation
      - configs/rl.yaml:
          - final
    outs:
      - reports/eval/rl_dev.outcomes.jsonl
    metrics:
      - reports/eval/rl_dev.json:
          cache: false
      - models/rl/${rl.run_name}/model_card.json:
          cache: false
