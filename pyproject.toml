[project]
name = "travel-agent"
version = "0.1.0"
requires-python = ">=3.11"
# ortools: solver sinh nhãn (planning/solver.py), logic thuần, không cần GPU.
# pyyaml: đọc configs/*.yaml.
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "ortools>=9.15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "httpx>=0.27"]
mlops = ["dvc>=3.50", "mlflow>=2.14"]
# Đếm token bằng tokenizer thật của model khi kiểm dataset (check-dataset). Không kéo torch.
dataset = ["tokenizers>=0.22", "jinja2>=3.1"]

[project.scripts]
travel-agent = "travel_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mlflow", "mlflow.*", "ortools", "ortools.*", "yaml"]
ignore_missing_imports = true
